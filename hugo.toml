# 站点基础配置
# 基础配置 (开发环境)
baseURL = "http://localhost:1313/"
relativeURLs = true

# 生产环境配置通过hugo --config参数覆盖
# 例如创建config.production.toml文件
# 确保资源路径基于 baseURL 拼接
canonifyURLs = false
# 强制所有链接使用相对路径
uglyURLs = true
absoluteURLs = false
defaultContentLanguage = "zh-cn"
languageCode = "zh-CN"
title = "MapleFlow"
theme = "PaperMod"

# 页脚版权（顶层参数；PaperMod footer.html 优先用 site.Copyright，覆盖默认的 © now.Year）
# 注意：siteStartYear 不被 PaperMod footer 读取（footer 仅用 now.Year），故用 copyright 控制年份范围
copyright = "© 2019 - 2026 thomasChen"

# ================= 服务设置 =================
# [services]
#   [services.disqus]
#     shortname = ""
#   [services.googleAnalytics]
#     ID = ""

# ================= 主题参数设置 =================
[params]
# 禅模式 (默认关闭。开启后变为双栏布局，关闭为翻转卡片)
# zenMode = true

# 配色方案：由 defaultTheme 控制（PaperMod 不读取 lightTheme/darkTheme，已删除）
defaultTheme = "auto"

# 背景图（PaperMod 主题推荐用 cover 配置，此处注释避免冲突）
# backgroundImage = "img/global-background.jpg"
# backgroundImageDark = ""

author = "thomasChen"
description = "运维开发 / SRE / DevOps 实战 SOP：Kubernetes、Docker、CI/CD、AIOps 与可观测性"
avatar = "img/avatar.svg"      # static/img/avatar.svg 占位头像（原 img/tn.png 不存在，会 404）
# 社交分享 OG 图：用 ogImage（PaperMod opengraph 读取此参数，不读 [params].images）
# 必须无前导斜杠，Hugo 会用 .Permalink 自动带 /mapleFlow/ 子路径，避免 404
ogImage = "img/og-cover.png"
# headerTitle 为无效字段（PaperMod 不识别），已移除
# motto = ""

# 页脚自定义文字
# footerBottomText = ""

# RSS 图标
rss = true

# 评论系统 (按需打开)
# utterancesRepo = ""
# valine = true
# LEANCLOUD_APP_ID = ""
# LEANCLOUD_APP_KEY = ""
# waline = true
# walineServer = ""

# === 联系方式 (原版字段) ===
email = "xxx@gmail.com"  # 取消注释，适配侧边栏邮箱图标显示

siteStartYear = 2019

# ================= 首页品牌信息（homeInfoParams） =================
# 仅 Title / Content / AlignSocialIconsTo 生效；AGENTS.md 已确认其余字段无效
[params.homeInfoParams]
Title = "MapleFlow"
# 内联 SVG 头像（避免 GitHub Pages 子路径下引用 static 资源 404；home_info.html 用 safeHTML 渲染）
Content = """
<p style="text-align:center;margin:0 0 1rem"><svg width="88" height="88" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="32" fill="#2D7FF9"/><text x="32" y="33" text-anchor="middle" fill="#fff" font-size="34" font-weight="700" font-family="sans-serif">M</text></svg></p>
运维开发 / SRE / DevOps 实战 SOP。把重复的劳动自动化，把不可控的故障变成可观测的指标。
"""
AlignSocialIconsTo = "center"

# ================= 社交图标（socialIcons） =================
[[params.socialIcons]]
icon = "email"
url = "mailto:xxx@gmail.com"
title = "Email"

[[params.socialIcons]]
icon = "github"
url = "https://github.com/thomasChen9691"
title = "GitHub"

# favicon 由 [params.assets].favicon 指定（static/favicon.svg）
[params.assets]
favicon = "favicon.svg"

# 代码高亮开关（PaperMod 自带高亮，保持关闭）
customSyntaxHighlighting = false

# ================= 功能开关 =================
# 导航栏吸顶
stickyNav = true

# 导航菜单排序（按 identifier 列出期望顺序；GitHub / Email 置于末尾）
reorderNavItems = ["home", "posts", "categories", "tags", "about", "search", "products", "github", "email", "RSS"]

# 移动端折叠菜单（适配 PaperMod 命名规范）
collapseNavItems = ["Posts", "Categories", "Tags"]

# 隐藏默认封面（核心修复：避免 cover 模板解析错误）
noDefaultSummaryCover = true
# 新增：全局 cover 配置（字典格式，解决之前的 image 字段解析错误）
[params.cover]
image = ""        # 留空表示不设置全局封面，避免字符串格式错误
hidden = false    # 封面是否隐藏
relative = false  # 图片路径是否相对

# 显示文章目录
showTableOfContents = true

# 文章页显示封面图
showSummaryCoverInPost = true

# 图片点击放大
imageZoomableInPost = true

# 显示上下篇导航
showPrevNextPost = true

# 分享按钮 (留空数组 = 关闭)
reorderShares = []

# ================= 自定义菜单 =================
# 注意：[params.navItems] 为无效字段（PaperMod 不读取），导航由上方 [[menu.main]] 驱动，已删除

# ================= 高级设置 =================
# 品牌样式经 assets/css/extended/custom.css 由 Hugo Pipes 自动并入主题样式表，
# 无需 [params.advanced].customCSS/customJS（PaperMod 不读取该配置，已删除）

# ================= 实验性功能 =================
# 注意：[params.experimental].jsDate 为无效字段（PaperMod 不识别），
# 中文日期由 Hugo/goldmark 原生支持，无需 JS 配置，已删除

# ======================================================
# 代码高亮设置 (Markup)
# ======================================================
[markup]
[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = true          # 显示行号
lineNumbersInTable = true
noClasses = false       # 使用 CSS 类高亮（适配 customCSS）
style = "github"        # 替换为更适配中文的高亮风格
tabWidth = 4

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true         # 允许 HTML 标签在 Markdown 中生效

# ======================================================
# 新增：PaperMod 主题关键配置（解决导航/样式兼容问题）
# ======================================================
# 菜单配置（PaperMod 标准写法，确保导航栏正常显示）
[[menu.main]]
identifier = "home"
name = "首页"
url = "/"
weight = 1

[[menu.main]]
identifier = "posts"
name = "文章"
url = "/posts/"
weight = 2

[[menu.main]]
identifier = "categories"
name = "分类"
url = "/categories/"
weight = 3

[[menu.main]]
identifier = "k8s"
name = "K8s"
url = "/categories/k8s/"
parent = "categories"
weight = 31

[[menu.main]]
identifier = "docker"
name = "Docker"
url = "/categories/docker/"
parent = "categories"
weight = 32

[[menu.main]]
identifier = "aiops"
name = "AIOps"
url = "/categories/aiops/"
parent = "categories"
weight = 33

[[menu.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 4

[[menu.main]]
identifier = "about"
name = "关于"
url = "/about.html"
weight = 5

# 站内搜索入口（content/search.md 的 layout=search 被 header.html 识别为搜索链接）
[[menu.main]]
identifier = "search"
name = "搜索"
url = "/search.html"
weight = 6

# 产品 / 资源页（方案 A：面包多第三方收银台；uglyURLs=true → /products.html）
[[menu.main]]
identifier = "products"
name = "产品"
url = "/products.html"
weight = 7

[[menu.main]]
identifier = "github"
name = "GitHub"
url = "https://github.com/thomasChen9691"
weight = 9

[[menu.main]]
identifier = "email"
name = "Email"
url = "mailto:xxx@gmail.com"
weight = 10

# 分页配置（避免列表页渲染错误）
[pagination]
paginate = 10  # 每页显示10篇文章

# 时区配置（解决日期显示错误）
timeZone = "Asia/Shanghai"

# ================= 站内搜索（PaperMod + fuse.js）=================
# 生成首页 JSON 索引（index.json），供 search.md 的 fuse.js 检索
[outputs]
home = ["HTML", "RSS", "JSON"]