name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main  # 推送到 main 分支自动部署
  workflow_dispatch:  # 新增：允许手动触发部署（方便测试）

# 核心补充：给 Actions 机器人配置足够的权限
permissions:
  contents: write       # 允许写入仓库内容（推 gh-pages 分支必需）
  pages: write          # 允许操作 GitHub Pages
  id-token: write       # 辅助身份验证，避免权限问题

# 并发控制：避免多次推送时重复部署
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true  # 新增：如果用了 PaperMod 主题（子模块），必须加这个
          fetch-depth: 0    # 新增：拉取完整提交记录，避免 Hugo 构建出错

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.164.0'
          extended: true
      - name: Build Hugo site
        # --cleanDestinationDir：构建前清空 public/。
        # 不加会导致「旧产物残留」—— Hugo 只覆盖变更文件，已删除文章对应的页面
        # 会一直留在 public/ 并被推上 gh-pages，造成线上内容与仓库状态脱节
        # （2026-09-20 审计中发现的 posts/aiop.html 即此类残留）。
        run: hugo --gc --minify --cleanDestinationDir --config hugo.toml,config.production.toml

      - name: Assert product states
        # 产品状态模块的产物断言（ADR-0004 / wayfinder 工单 0005）：
        # fixture 全分支 + 真实数据线上回归 + 契约坏用例。失败即阻断部署——
        # 不让失实的「可下载产品」数字上线（2026-10 首页 5-vs-0 事故的守门）。
        run: python3 tests/assert_product_states.py

      - name: Assert SOP pipeline
        # SOP 发布管线的产物断言（wayfinder 工单 0008/0009 决议）：
        # 6 篇派生文章的迁移保真（golden 逐字节比对）+ 契约坏用例构建失败
        # + draft 语义 + README↔注册表漂移 + ref 解析 + 搜索投影。
        # 失败即阻断部署——源笔记与线上页面的沉默分叉从此不可能发生。
        run: python3 tests/assert_sop_pipeline.py

      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v4  # 升级：v4 比 v3 更稳定，适配新版权限
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages  # 显式指定部署到 gh-pages 分支（更清晰）