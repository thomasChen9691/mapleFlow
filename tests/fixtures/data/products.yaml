# ============================================================
# 产品状态模块的 fixture 数据（测试专用，不进生产构建）
# ------------------------------------------------------------
# 字段与 data/products.yaml 一致，另加 listed（上架状态，必填无缺省）：
#   listed: true  → 已上架，buy_url 必须非空且真实
#   listed: false → 未上架（即将上架），buy_url 必须为空
#   price         → 必填；0 = 免费（显式写 0，不缺省）
#
# 控件语义四状态组合（ADR-0004 形状 B）：已上架+付费 / 已上架+免费 /
#   未上架+付费 / 未上架+免费。
# featured 布局（0019 决议：过滤与截断双分支可分辨）：
#   第 1 行 fx-unlisted-plain featured: false —— 非 featured 对照行，
#     必须不上首页（守住 product-items 的 where featured 分支；旧布局
#     4 行全 featured 且排在 yaml 前部，「取前 3」与「过滤后取前 3」
#     结果重合，该分支实际无回归保护——变异检验实测）。
#   后 4 行全部 featured: true —— 首页 limit=3 截断后出前 3 条，
#     第 4 条（fx-unlisted-free）必须不上首页。
#   产品页（短代码默认 limit=0）渲染全部 5 行。
# 契约坏用例见 tests/fixtures/bad/（每个用例的构建必须失败）。
# ============================================================

