# ============================================================
# 产品 / 资源索引（数据驱动）
# ------------------------------------------------------------
# 用法：新增或下架资源只改本文件，页面自动渲染，无需碰 HTML。
#
# 字段说明：
#   id       唯一标识（URL 锚点用，改名前请勿变动）
#   name     资源名称
#   kind     形态：workflow(工作流) | document(文档) | question-bank(题库)
#   summary  一句话说明（一句话讲清拿到什么，不写营销话术）
#   version  版本号（未定版可留空）
#   scale    篇幅/体量（模板数、页数、题数等，必须真实可核对）
#   updated  最近更新日期（YYYY-MM-DD，不要加引号）
#   price    价格（数字，0 表示免费）
#   buy_url  面包多商品页 URL（留空 = 显示"即将上架"，不跳转）
#   featured 是否进入首页精选（true/false）
#
# ⚠️ 上线前必做：把 buy_url 逐个替换为你的真实面包多商品页地址。
# ============================================================

